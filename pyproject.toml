[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionqa-offline"
version = "0.1.0"
description = "Provider-neutral offline VisionQA simulation evaluator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
visionqa = "visionqa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
